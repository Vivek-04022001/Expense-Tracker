name: paisa
description: India-first expense tracker with SMS auto-import.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # HTTP client
  dio: ^5.7.0

  # Secure token storage
  flutter_secure_storage: ^9.2.2

  # Persistent prefs (theme mode, onboarding flag)
  shared_preferences: ^2.3.3

  # Charts
  fl_chart: ^0.70.0

  # Animations
  flutter_animate: ^4.5.0

  # Icons (consistent stroke, designed for UI)
  phosphor_flutter: ^2.1.0

  # Date formatting
  intl: ^0.20.0

  # Fonts
  google_fonts: ^6.2.1

  # For generating app icons from a single image
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  image_path: "assets/images/app_logo.png" # Path to your logo file
  remove_alpha_ios: true # Removes alpha channel for iOS to avoid transparency issues
  adaptive_icon_background: "#ffffff" # Background color for Android adaptive icons (optional but recommended)
  adaptive_icon_foreground: "assets/images/app_logo.png"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.1
  mocktail: ^1.0.5

flutter:
  uses-material-design: true

  assets:
    - assets/images/
